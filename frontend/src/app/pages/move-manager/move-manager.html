<div class="move-manager">

  <div class="content">

    <!-- EQUIPPED -->
    <div class="section">

      <h3>Equipped Moves</h3>

      <div class="equipped-list">
        <div class="move-chip" *ngFor="let move of equippedMoves">
          {{ move.name }}
        </div>
      </div>

    </div>

    <!-- AVAILABLE -->
    <div class="section">

      <h3>Available Moves</h3>

      <div class="moves-grid">

        <button
          class="move-btn"
          *ngFor="let move of learnedMoves"
          [class.active]="isEquipped(move)"
          (click)="toggleMove(move)"
        >
          {{ move.name }}
        </button>

      </div>

    </div>

  </div>

  <!-- CONTINUE OUTSIDE CARD -->
  <div class="continue-wrapper">

    <button
      class="continue-btn"
      [disabled]="!canContinue()"
      (click)="goToMap()"
    >
      CONTINUE
    </button>

  </div>

</div>
