<app-back-button to="/run-overview"></app-back-button>

<div class="move-manager">
  <div class="content">
    <div class="section">
      <h3>Equipped Moves</h3>
      <div class="equipped-list">
        <div class="move-chip-wrapper" *ngFor="let move of equippedMoves">
          <div class="move-chip">{{ move.name }}</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Available Moves</h3>
      <div class="moves-grid">
        <div class="move-btn-wrapper"
          *ngFor="let move of learnedMoves"
          (mouseenter)="hoveredMove = move"
          (mouseleave)="hoveredMove = null"
        >
          <button
            class="move-btn"
            [class.active]="isEquipped(move)"
            (click)="toggleMove(move)"
          >
            {{ move.name }}
          </button>
          <div class="move-tooltip" *ngIf="hoveredMove === move">
            <p class="tooltip-desc">{{ move.description }}</p>
            <p class="tooltip-type">{{ move.type }} · {{ move.effect }}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="continue-wrapper">
      <button
        class="continue-btn"
        [disabled]="!canContinue()"
        (click)="goToMap()"
      >
        CONTINUE
      </button>
    </div>
  </div>
</div>
