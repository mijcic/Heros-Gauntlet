<div class="level-ring-global" *ngIf="hero && !isOnBattle && !isOnMainMenu">
  <svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="45" class="ring-bg" />
    <circle 
      cx="50" cy="50" r="45" 
      class="ring-progress"
      [attr.stroke-dasharray]="getCircumference()"
      [attr.stroke-dashoffset]="getDashOffset()"
    />
  </svg>
  <div class="level-number">{{ hero.level }}</div>
  <div class="xp-tooltip">{{ hero.xp }} / {{ getXpForNextLevel(hero.level) }} XP</div>
</div>
